<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة متابعة الحملات التسويقية · موهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F6F6F8}
.mwx{min-height:100vh}

.mwx{color-scheme:light;min-height:100%;direction:rtl}
.mwx main{position:relative;min-height:200px}
.mwx .post .art.vid .car{max-width:270px}
.mwx .post .trk video{flex:0 0 100%;width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#111;border-radius:12px}
.mwx .dlt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.mwx .dlt svg.i{width:15px;height:15px;color:#1f8a4c}
.mwx .dlt b{color:#1f8a4c;font-weight:700;font-size:13.5px}
.mwx .dlt i{width:4px;height:4px;border-radius:50%;background:#c9c6d9}
.mwx .mets small,.mwx .smets small{display:flex!important;align-items:center;gap:5px}
.mwx .mets small svg.i,.mwx .smets small svg.i{width:14px;height:14px;flex:none;color:var(--violet)}
.mwx .post .art.imgs{display:block;position:relative;padding:22px 26px 14px}
.mwx .post .car{overflow:hidden;max-width:320px;margin:0 auto;border-radius:12px;box-shadow:0 10px 30px rgba(42,31,134,.25);touch-action:pan-y;user-select:none}
.mwx .post .trk{display:flex;transition:transform .35s ease}
.mwx .post .trk img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;display:block;pointer-events:none}
.mwx .post .cb{position:absolute;top:calc(50% - 30px);width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--violet);padding:0;box-shadow:0 4px 14px rgba(33,25,100,.18);cursor:pointer;display:grid;place-items:center}
.mwx .post .cb.pv{inset-inline-start:calc(50% - 200px)}
.mwx .post .cb.nx{inset-inline-end:calc(50% - 200px)}
.mwx .post .cdots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.mwx .post .cdots i{width:7px;height:7px;border-radius:50%;background:#d6d1f5;cursor:pointer;transition:width .2s}
.mwx .post .cdots i.on{width:18px;border-radius:4px;background:var(--violet)}
@media (max-width:520px){.mwx .post .cb.pv{inset-inline-start:6px}.mwx .post .cb.nx{inset-inline-end:6px}}
@media (min-width:981px){.mwx .grid3{align-items:stretch}
.mwx .grid3>.card{height:600px;display:flex;flex-direction:column;overflow:hidden}
.mwx .grid3>.card>.chart,.mwx .grid3>.card>#ch2,.mwx .grid3>.card>#ch4{flex:1;min-height:0}
.mwx .grid3 #ch2{display:flex;flex-direction:column}
.mwx .grid3 #ch2 .dlist{flex:1;min-height:0;overflow-y:auto;padding-inline-end:4px}
.mwx .grid3 #ch4{overflow:hidden}}
.mwx .cbox.closed{background:linear-gradient(160deg,#448A9C,#2f6f80)}
.mwx .cbox.closed svg{width:30px;height:30px;stroke:#fff}
.mwx .tab.closed::after{content:"مغلق";font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.22);margin-inline-start:4px}
.mwx .tab.closed[aria-selected=true]::after{background:#E8F3F5;color:#2f6f80}
.mwx .pring .trk{position:absolute;inset:6px;border-radius:50%;background:#F2F2F2;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14.5px),#000 calc(100% - 14px));mask:radial-gradient(farthest-side,transparent calc(100% - 14.5px),#000 calc(100% - 14px))}
.mwx .pring .rg{position:absolute;inset:6px;border-radius:50%;background:linear-gradient(180deg,#7A5DF5,#205BC3);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14.5px),#000 calc(100% - 14px)),conic-gradient(#000 calc(var(--p) * 1deg),transparent 0);-webkit-mask-composite:source-in;mask:radial-gradient(farthest-side,transparent calc(100% - 14.5px),#000 calc(100% - 14px)) intersect,conic-gradient(#000 calc(var(--p) * 1deg),transparent 0)}
.mwx .pring .cap{position:absolute;inset:6px;pointer-events:none}
.mwx .pring .cap::after{content:"";position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#7A5DF5}
.mwx .pring .cap.c1::after{background:#3f5fd0}
.mwx{
  /* Mawhiba brand palette — screens */
  --violet:#7A5DF5;--heritage:#205BC3;--cyan:#7DD2E9;--amber:#F5BD19;
  --vblue:#4D7CCF;--dblue:#083077;--sviolet:#8C8CE6;--dpurple:#211964;--ssky:#B0E4F1;--teal:#448A9C;--coral:#DF7753;--sand:#F8E7B7;
  --gray:#666666;--lgray:#F2F2F2;
  --bg:#F2F2F2;--card:#fff;--ink:#211964;--ink2:#666666;--muted:#8F8F99;--line:#E6E6EC;--soft:#F4F2FE;
  --p1:var(--violet);--p2:var(--violet);--navy:var(--dpurple);--blue:var(--heritage);--sky:var(--cyan);--gold:var(--amber);
  --warn-bg:#FDF5DC;--warn-line:var(--amber);--info-bg:#EEF8FC;--info-line:var(--cyan);--good:#1B7F5C;
  /* brand gradients: primary ~85%, secondary ≤15%, max 3 stops */
  --g-violet:linear-gradient(135deg,#7A5DF5 0%,#7A5DF5 55%,#211964 135%);
  --g-blue:linear-gradient(135deg,#205BC3 0%,#205BC3 55%,#083077 135%);
  --g-amber:linear-gradient(135deg,#F5BD19 0%,#F5BD19 55%,#DF7753 135%);
  --g-deep:linear-gradient(135deg,#211964 0%,#211964 55%,#7A5DF5 135%);
  --g-sky:linear-gradient(135deg,#7DD2E9 0%,#7DD2E9 55%,#4D7CCF 135%);
  --r:16px;--font:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif;
}
.mwx *{box-sizing:border-box}
.mwx{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.mwx .wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
.mwx svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mwx .num{font-variant-numeric:tabular-nums}
.mwx .hero{position:relative;overflow:hidden;border-radius:20px;padding:28px 32px 26px;color:#fff;
  background:var(--g-violet)}
.mwx .pattern{position:absolute;pointer-events:none;fill:none;stroke:rgba(255,255,255,.2);stroke-width:2.5}
.mwx .hero .pattern{width:520px;left:22%;top:-70px}
.mwx .hcard .pattern{width:210px;inset-inline-end:-70px;bottom:-80px;stroke:rgba(255,255,255,.22);stroke-width:4}
.mwx .hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.mwx .brand{display:flex;align-items:center;gap:18px}
.mwx .logo{padding-inline-end:18px;border-inline-end:1px solid rgba(255,255,255,.3);display:flex;align-items:center}
.mwx .logo img{height:78px;width:auto;display:block}
.mwx .eyebrow{font-size:12.5px;opacity:.85}
.mwx .hero h1{margin:2px 0 0;font-size:clamp(22px,3vw,30px);font-weight:700}
.mwx .stamp{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);border-radius:99px;padding:7px 16px;font-size:13px}
.mwx .tabs{position:relative;display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:flex-start;padding-inline-start:0}
.mwx .tab{font:inherit;font-weight:600;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mwx .tab[aria-selected=true]{background:#fff;color:var(--ink);border-color:#fff}
.mwx .tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mwx .row2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-top:18px}
.mwx .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.mwx .ctitle{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:0 0 4px}
.mwx .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--navy);flex:none}
.mwx .ic svg.i{width:16px;height:16px}
.mwx .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.mwx .sec{margin-top:34px}
.mwx .sec-h{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15.5px;margin:0 0 16px}
.mwx .sec-h::before{content:"";width:4px;height:20px;border-radius:4px;background:var(--p2)}
.mwx .sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.mwx .tagline{display:flex;align-items:center;gap:6px;color:var(--p2);font-weight:600;font-size:13.5px}
.mwx .pname{margin:6px 0 16px;font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.35}
.mwx .count{display:flex;align-items:center;gap:16px}
.mwx .cbox{width:84px;height:84px;border-radius:16px;background:var(--g-violet);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(122,93,245,.28)}
.mwx .cbox b{font-size:32px;line-height:1}
.mwx .cbox span{font-size:12px;opacity:.9}
.mwx .count h4{margin:0;font-size:15px}
.mwx .count p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.mwx .track{position:relative;height:8px;border-radius:99px;background:var(--line);margin:22px 0 8px}
.mwx .track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--violet)}
.mwx .track em{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--p1);transform:translate(50%,-50%)}
.mwx .dates{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.mwx .dates b{color:var(--ink)}
.mwx .callout{margin-top:18px;background:var(--warn-bg);border-inline-start:4px solid var(--warn-line);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.8}
.mwx .callout.info{background:var(--info-bg);border-color:var(--info-line);font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.mwx .prow{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:10px}
.mwx .pring{position:relative;width:150px;height:150px}
.mwx .pring svg{width:150px;height:150px;transform:rotate(-90deg)}
.mwx .pring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mwx .pring b{font-size:26px;color:var(--p2)}
.mwx .pring span{font-size:12px;color:var(--muted)}
.mwx .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mwx .big b{font-size:36px;font-weight:700}
.mwx .big span{color:var(--muted);font-size:13.5px}
.mwx .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 12px;margin-top:6px;background:#E3F0F3;color:var(--teal)}
.mwx .badge.behind{background:#FBE9E3;color:#B2502E}
.mwx .minibar{margin-top:12px}
.mwx .minibar .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.mwx .minibar .r small{color:var(--muted)}
.mwx .minibar .t{height:5px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.mwx .minibar .t i{display:block;height:100%;background:var(--p2);border-radius:99px}
.mwx .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mwx .tile{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mwx .tile .l{font-size:11.5px;color:var(--ink2);line-height:1.5}
.mwx .tile b{display:block;font-size:22px;margin-top:4px}
.mwx .tile .ic{width:28px;height:28px;background:var(--p1)}
.mwx .hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.mwx .hcard{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px;color:#fff;min-height:132px}
.mwx .hcard .h{position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.mwx .hcard .h span{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.mwx .hcard b{position:relative;z-index:1;display:block;font-size:30px;font-weight:700;margin:8px 0 2px}
.mwx .hcard p{margin:0;font-size:12.5px;opacity:.92;position:relative;z-index:1}
.mwx .hcard p b{display:inline;font-size:inherit;margin:0;font-weight:700}
.mwx .h-purple{background:var(--g-violet)}
.mwx .h-blue{background:var(--g-blue)}
.mwx .h-gold{background:var(--g-amber);color:#211964}
.mwx .h-gold .h span{background:rgba(0,0,0,.08)}
.mwx .h-navy{background:var(--g-deep)}
.mwx .funnel{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:8px}
.mwx .fstep{color:#fff;text-align:center;border-radius:8px;padding:10px 12px;box-shadow:0 6px 16px rgba(30,26,92,.15)}
.mwx .fstep span{display:block;font-size:13px;opacity:.9}
.mwx .fstep b{font-size:20px}
.mwx .fstep.empty{background:#fff!important;color:var(--muted);border:1px solid var(--line);box-shadow:none}
.mwx .frate{font-size:11.5px;color:var(--muted);padding:6px 0}
.mwx .frate b{color:var(--p2)}
.mwx .ftotal{margin-top:16px;background:var(--soft);border-radius:10px;padding:8px 18px;text-align:center;font-size:12px;color:var(--ink2)}
.mwx .ftotal b{display:block;font-size:17px;color:var(--ink)}
.mwx .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.mwx .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.mwx .stat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mwx .stat .l{font-size:12.5px;color:var(--ink2);line-height:1.5}
.mwx .stat b{font-size:26px;font-weight:700;text-align:left;direction:ltr;margin-top:10px}
.mwx .stat b.pend{color:var(--muted)}
.mwx .c-navy{background:var(--navy)}
.mwx .c-purple{background:var(--p1)}
.mwx .c-teal{background:var(--teal)}
.mwx .c-gold{background:var(--gold)}
.mwx .c-blue{background:var(--blue)}
.mwx .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.mwx .chart svg{display:block;width:100%;height:auto}
.mwx .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.mwx .gl{stroke:var(--line)}
.mwx .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.mwx .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.mwx .dlist{margin-top:14px}
.mwx .dlist div{display:grid;grid-template-columns:14px 1fr auto 48px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.mwx .dlist i{width:10px;height:10px;border-radius:3px}
.mwx .dlist b{font-variant-numeric:tabular-nums}
.mwx .dlist small{color:var(--muted);text-align:left}
.mwx .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mwx .chip{background:var(--soft);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink2)}
.mwx .chip em{font-style:normal;color:var(--p2);font-weight:700;margin-inline-end:4px}
.mwx .chip b{color:var(--ink);margin-inline-start:4px}
.mwx #tip{position:absolute;z-index:30;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;border-radius:8px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mwx table{width:100%;border-collapse:collapse;font-size:13px}
.mwx th{font-weight:500;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px}
.mwx td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.mwx tr:last-child td{border-bottom:0}
.mwx .pill{display:inline-block;font-size:11px;border-radius:99px;padding:2px 9px;background:#EEEAFE;color:var(--violet)}
.mwx .pill.sec2{background:#E3F0F3;color:var(--teal)}
.mwx .kgoal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 22px}
.mwx .kgoal div{background:var(--soft);border-radius:12px;padding:14px 16px}
.mwx .kgoal h5{margin:0;font-size:14px}
.mwx .kgoal b{font-size:24px;color:var(--p2)}
.mwx .kgoal small{display:block;color:var(--muted);font-size:11.5px}
.mwx .content2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.mwx .post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mwx .post .hd{background:var(--violet);color:#fff;padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.mwx .post .art{background:var(--soft);padding:26px;display:flex;align-items:center;justify-content:center;min-height:180px}
.mwx .post .art:not(.imgs)>div{position:relative;overflow:hidden;max-width:260px;width:100%;aspect-ratio:4/5;border-radius:10px;background:var(--g-violet);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;box-shadow:0 10px 30px rgba(42,31,134,.25)}
.mwx .post .art .pattern{width:300px;left:-60px;top:-40px;stroke:rgba(255,255,255,.22);stroke-width:4}
.mwx .post .art b{position:relative;font-size:22px;line-height:1.35}
.mwx .post .art span{font-size:12px;color:var(--gold);margin-top:6px}
.mwx .post .tx{padding:16px 18px 6px;white-space:normal;font-size:13.5px;line-height:1.75}
.mwx .post .tx p{margin:0 0 8px}
.mwx .post .tx p:last-child{margin-bottom:0}
.mwx .link{display:inline-flex;align-items:center;gap:6px;color:var(--p2);font-size:12.5px;direction:ltr;text-decoration:none}
.mwx .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px 14px}
.mwx .mets div,.mwx .smets div{background:var(--soft);border-radius:10px;padding:8px 12px}
.mwx .mets small,.mwx .smets small{display:block;color:var(--muted);font-size:11px}
.mwx .mets b,.mwx .smets b{font-size:17px}
.mwx .phone{max-width:380px;margin:0 auto;border:3px solid var(--navy);border-radius:28px;padding:14px 16px 18px;background:#fff}
.mwx .phone .notch{width:90px;height:6px;border-radius:9px;background:var(--cyan);margin:0 auto 14px}
.mwx .phone h5{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:13px}
.mwx .bubble{background:var(--info-bg);border:1px solid var(--ssky);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.9}
.mwx .aud{font-size:12px;color:var(--muted);margin:10px 0;display:flex;gap:6px}
.mwx .smets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mwx .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.mwx footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:980px){.mwx .row2,.mwx .grid3,.mwx .content2{grid-template-columns:1fr}
.mwx .tiles{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:600px){.mwx .wrap{padding:14px 12px 40px}
.mwx .hero{padding:22px 18px}
.mwx .prow{grid-template-columns:1fr;justify-items:center}
.mwx .tiles,.mwx .kgoal{grid-template-columns:1fr}
.mwx .stats{grid-template-columns:1fr 1fr}
.mwx .stat b{font-size:20px}
}


.mwx .post .trk iframe.drv{flex:0 0 100%;width:100%;aspect-ratio:9/16;border:0;display:block;background:#111;border-radius:12px}

dash.loader('indicators', {
  description: 'يقلب تبويب المؤشرات: صف لكل برنامج، وعمود لكل رمز مؤشر، والأرقام نصًا تصبح أرقامًا (النسب المئوية كسورًا).',
  fn: ({ answer }) => {
    const a = typeof answer === 'string' ? JSON.parse(answer) : answer;
    const v = (a && a.values) || [];
    if (!v.length) throw new Error('Google Sheets returned no values for ' + ((a && a.range) || 'the range'));
    const TEXT = ['report_date', 'program_name', 'tagline', 'open_date', 'close_date', 'reach_note', 'conversion_note'];
    const cell = (s, k) => {
      if (s == null) return null;
      const t = String(s).trim();
      if (t === '' || t === '-') return null;
      if (TEXT.includes(k)) return t;
      const c = t.replace(/,/g, '');
      if (/^-?\d+(\.\d+)?%$/.test(c)) return Number(c.slice(0, -1)) / 100;
      if (/^-?\d+(\.\d+)?$/.test(c)) return Number(c);
      return t;
    };
    const progs = v[0].slice(2, 6);
    const codes = v.slice(1).map((r) => r[0]).filter(Boolean);
    const rows = progs.map((p, i) => {
      const r = { program: p };
      for (const row of v.slice(1)) if (row[0]) r[row[0]] = cell(row[i + 2], row[0]);
      return r;
    });
    return { columns: ['program', ...codes], rows };
  },
});

      return o;
    }).filter((o) => o.program && (o.text || o.type));
    return { columns: ['row', ...names], rows };
  } });

function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n==null||n===''?'—':Number(n).toLocaleString('en-US')}
function pct(n,d){return d?(n/d*100):0}
function D(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dayLabel(md){var p=md.split('-');return (+p[1])+' '+MONTHS[+p[0]-1]}
function sum(a){return a.reduce(function(x,y){return x+(y||0)},0)}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function kfmt(v){return v>=1000?(v/1000).toFixed(v%1000===0?0:1).replace(/\.0$/,'')+'k':String(v)}

function showTip(h,x,y){if(!tip)return;tip.innerHTML=h;tip.hidden=false;var hr=tip.parentElement.getBoundingClientRect(),r=tip.getBoundingClientRect();tip.style.left=Math.min(hr.width-r.width-8,Math.max(8,x-hr.left+12))+'px';tip.style.top=Math.max(8,y-hr.top-r.height-10)+'px'}
function hideTip(){if(tip)tip.hidden=true}

function timing(p){
  var today=new Date();today.setHours(0,0,0,0);
  var o=D(p.open),c=D(p.close),total=Math.round((c-o)/864e5)+1;
  var left=Math.max(0,Math.round((c-today)/864e5)),el=Math.min(total,Math.max(0,total-left));
  return {total:total,left:left,elapsed:el,frac:total?el/total:0,closed:today>=c}
}

function programCard(p,t){

    :'سُجّل <b>'+fmt(reg)+'</b> من أصل <b>'+fmt(p.target)+'</b> مستهدفًا (<b>'+pct(reg,p.target).toFixed(1)+'%</b>)، ولتحقيق الهدف يلزم <b>'+fmt(need)+'</b> تسجيلًا يوميًا خلال <b>'+t.left+'</b> يومًا متبقيًا.';

   :'<div class="count"><div class="cbox"><b class="num">'+t.left+'</b><span>يوم</span></div><div><h4>متبقية على إغلاق التسجيل</h4><p>مضى <b>'+Math.round(fp)+'%</b> من مدة التسجيل</p></div></div>';

   +'<div class="dates"><span>فتح التسجيل <b>'+p.open+'</b></span><span>إغلاق التسجيل <b>'+p.close+'</b></span></div>'
   +'<div class="callout">'+call+'</div></section>'
}

     +(reg!=null&&reg>=p.target
      ?'<div class="tile"><div><div class="l">الزيادة عن المستهدف</div><b class="num">'+fmt(reg-p.target)+'</b></div><span class="ic">'+ic('trend')+'</span></div>'
      :'<div class="tile"><div><div class="l">الفارق عن المستهدف</div><b class="num">'+fmt(rem)+'</b></div><span class="ic">'+ic('flag')+'</span></div>')

function highlights(p){
  var k=p.kpi,cards=[];
  var tc=p.clicks.length?p.clicks.slice().sort(function(a,b){return b[1]-a[1]})[0]:null,ct=sum(p.clicks.map(function(c){return c[1]}));
  cards.push(['h-purple','trophy','القناة الأعلى نقرًا',tc?fmt(tc[1]):'—',tc?'<b>'+esc(tc[0])+'</b> · '+Math.round(pct(tc[1],ct))+'% من إجمالي النقرات':'يظهر بعد إضافة الأرقام']);
  if(p.geo.length||cur==='m360'){var tg=p.geo.length?p.geo.slice().sort(function(a,b){return b[1]-a[1]})[0]:null;cards.push(['h-blue','pin','الأعلى تسجيلًا جغرافيًا',tg?fmt(tg[1]):'—',tg?'<b>'+esc(tg[0])+'</b> مسجل':'يظهر بعد إضافة الأرقام'])}

}
function funnel(p){
  var F=p.funnel,n=F.length,cols=['var(--g-deep)','var(--g-blue)','var(--g-violet)','linear-gradient(135deg,#8C8CE6 0%,#8C8CE6 55%,#7A5DF5 135%)'];
  var h='<div class="sec"><h3 class="sec-h">مسار التحويل</h3><section class="card"><div class="ctitle"><span class="ic">'+ic('funnel')+'</span>من الترويج الرقمي إلى التسجيل</div><p class="sub">كل مرحلة ونسبة الانتقال إليها من المرحلة السابقة.</p><div class="funnel">';
  F.forEach(function(s,i){var w=64-i*(n>3?8:10),empty=s[1]==null;
    if(i>0&&!empty&&F[i-1][1])h+='<div class="frate">'+ic('trend')+' نسبة الانتقال <b>'+pct(s[1],F[i-1][1]).toFixed(i===1?2:1)+'%</b></div>';else if(i>0)h+='<div style="height:10px"></div>';

    var p={tab:P,icon:ICON_OF[key],name:r.program_name||P,tagline:r.tagline||'',open:r.open_date||'',close:r.close_date||'',
      target:r.target_total,registered:r.registered_total==null?null:r.registered_total};
    if(r.target_mawhiba!=null||r.target_external!=null)p.split=[['من طلبة موهبة',r.registered_mawhiba,r.target_mawhiba],['من خارج موهبة',r.registered_external,r.target_external]];
    p.kpi={impressions:r.impressions,digital:r.digital_promo,smsNumbers:r.sms_numbers,smsCount:r.sms_count,clicks:r.link_clicks,social:r.social_clicks,pageVisits:r.page_visits};
    ['impressions','digital','smsNumbers','smsCount','clicks','social','pageVisits'].forEach(function(k){if(p.kpi[k]===undefined)p.kpi[k]=null});
    p.regStats=REG_DEFS.filter(function(d){return r[d[1]]!=null}).map(function(d){return [d[0],r[d[1]],d[2],d[3]]});
    var aud=[[key==='m360'?'إجمالي الجمهور المستهدف':'إجمالي الجمهور المستهدف لكل المستويات','audience_total','users'],['من تم استهدافهم منذ بدء الحملة','audience_reached','send'],['المستهدفون من مستويات (عن بعد)','audience_remote','globe']];
    p.audienceStats=aud.filter(function(d){return r[d[1]]!=null}).map(function(d){return [d[0],fmt(r[d[1]]),d[2]]});
    p.note=r.reach_note||'';
    if(r.saved_not_submitted!=null)p.saved=r.saved_not_submitted;
    p.funnel=rowsFor('funnel',P).sort(function(a,b){return a.step-b.step}).map(function(f){return [f.stage,f.value]});
    if(!p.funnel.length)p.funnel=[['الترويج الرقمي',null],['نقرات السوشل ميديا',null],['المسجلون',null]];
    var dl=rowsFor('daily',P).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    var dn=dl.filter(function(x){return x.new!=null}),dc=dl.filter(function(x){return x.mawhiba_cum!=null});
    if(dn.length)p.daily={type:'daily',dates:dn.map(function(x){return x.date.slice(5,10)}),values:dn.map(function(x){return x.new})};
    else if(dc.length)p.daily={type:'cumulative',dates:dc.map(function(x){return x.date.slice(5,10)}),mawhiba:dc.map(function(x){return x.mawhiba_cum}),external:dc.map(function(x){return x.external_cum||0}),saved:dc.some(function(x){return x.saved_cum!=null})?dc.map(function(x){return x.saved_cum||0}):null};
    else p.daily=null;
    p.delta=null;
    if(dn.length){var lastN=dn[dn.length-1],ldN=D(lastN.date.slice(0,10));p.delta={day:lastN.new,date:lastN.date.slice(5,10),week:dn.filter(function(x){return (ldN-D(x.date.slice(0,10)))/864e5<7}).reduce(function(s,x){return s+(x.new||0)},0)}}
    else{var cu=dl.filter(function(x){return x.cumulative>0});if(cu.length>1){var lc=cu[cu.length-1],ldC=D(lc.date.slice(0,10)),pc=cu[cu.length-2],wc=cu.filter(function(x){return (ldC-D(x.date.slice(0,10)))/864e5>=7}).pop();p.delta={day:lc.cumulative-pc.cumulative,date:lc.date.slice(5,10),week:wc?lc.cumulative-wc.cumulative:null}}}
    if(p.daily&&p.daily.type==='cumulative'&&!p.daily.saved)delete p.daily.saved;
    p.clicks=rowsFor('clicks',P).filter(function(c){return c.clicks!=null}).sort(function(a,b){return b.clicks-a.clicks}).map(function(c){return [c.channel,c.clicks]});
    p.geo=rowsFor('geo',P).filter(function(g){return g.registered!=null&&g.lon!=null&&g.lat!=null}).sort(function(a,b){return b.registered-a.registered}).map(function(g){return [g.region,g.registered,g.lon,g.lat]});
    p.audience=rowsFor('audience',P).map(function(a){return [a.audience_type||'',a.category||'',a.segment||'',a.count==null?'':fmt(a.count),a.note||'']});
    var gl=rowsFor('goals',P);
    if(gl.length){
      p.goalsKpi=gl.filter(function(g){return g.kind==='مؤشر أداء'}).map(function(g){return [g.item,g.target||'—',g.method||'']});
      p.goalsPrograms=gl.filter(function(g){return g.kind!=='مؤشر أداء'}).map(function(g){var n=Number(String(g.target||'').replace(/,/g,''));return [g.item,g.target_group||'',g.period||'',isNaN(n)?null:n]});
    }
    var cs=rowsFor('content',P);
    var sms=cs.filter(function(c){return c.type==='رسالة نصية'}).pop(),post=cs.filter(function(c){return c.type==='منشور سوشل ميديا'}).pop();
    p.sms=sms?{text:sms.text||'',link:firstLink(sms.link),audience:sms.target_group||'',numbers:sms.numbers,clicks:sms.clicks}:null;
    p.post=post?{text:post.text||'',link:firstLink(post.link),impressions:post.impressions,clicks:post.clicks,engagement:post.engagement,art:p.tagline,media:driveIds(post.media)}:null;
    out.programs[key]=p;
  });
  return out;
}

var TABK=['tamayuz','npg','bebras','m360'];

}

var IDS=['indicators','funnel','daily','clicks','geo','audience','goals','content'];
dash.draw('stamp',function(el){var r=rowsFor('indicators','التميز')[0];el.textContent=r&&r.report_date?r.report_date:'—'});

  if(dash.data('indicators').status!=='ok'||st.some(function(s){return s==='loading'})){el.textContent='—';el.classList.add('dash-skeleton');return}
  el.classList.remove('dash-skeleton');

});
